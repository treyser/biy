<!DOCTYPE html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ініціатива</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="rollwin">
  <div class="rw">
    <div class="rtitle">Ініціатива</div>
    <div class="rname" id="name"></div>
    <div class="die" id="die">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <polygon class="f0" points="50,4 92,28 92,72 50,96 8,72 8,28"/>
        <polygon class="f1" points="50,22 74,64 26,64"/>
        <path class="ed" d="M50 4 L50 22 M92 28 L74 64 M92 72 L74 64 M50 96 L74 64 M50 96 L26 64 M8 72 L26 64 M8 28 L26 64 M8 28 L50 22 M92 28 L50 22"/>
      </svg>
      <span id="face">20</span>
    </div>
    <div class="sum" id="sum">&nbsp;</div>
    <div class="ractions" id="actions">
      <button type="button" class="gold big" id="go">Кинути d20</button>
      <div class="own">
        <span>або свій кидок:</span>
        <input type="number" id="own" min="1" max="20" placeholder="1–20">
        <button type="button" id="ownok">Записати</button>
      </div>
      <label class="bonusrow">Додатковий бонус <input type="number" id="bonus" value="0"></label>
    </div>
    <button type="button" class="ghost" id="close">Закрити</button>
  </div>
  <script type="module" src="/src/roll.js"></script>
</body>
</html>
